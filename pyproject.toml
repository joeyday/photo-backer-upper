[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-backer-upper"
version = "0.1.0"
description = "Back up iCloud Photos to a main and a secondary backup location, organized by date."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff", "pytest"]

[project.scripts]
pback = "photo_backer_upper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
